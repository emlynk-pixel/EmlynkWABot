# Non-secret environment of the Cloud Run service emlynk-sheet-sync-worker
# (Docs/GOOGLE_SHEET_CANDIDATE_SYNC_ARCHITECTURE.md, Section 24.9). Used with
#   gcloud run deploy ... --env-vars-file deploy/sheet-sync-worker.env.yaml
# DATABASE_URL is NOT here: it comes from Secret Manager (--set-secrets).
# There is no Google key: the service runs as emlynk-sheet-sync@... (ADC).
# GOOGLE_APPLICATION_CREDENTIALS must never be set.
#
# SAFE DEFAULT: writes disabled. Change SHEET_SYNC_ENABLED only through the
# controlled activation procedure (Section 24.10).
SHEET_SPREADSHEET_ID: "1-11g-0tQruJbgVslH0nzCzG_JRr-4LahSCU8ZJirMpE"
SHEET_TAB_NAME: "Emlynk Candidate Operational Mirror"
SHEET_SYNC_ENABLED: "false"
DATABASE_POOL_MAX: "2"
SHEET_SYNC_POLL_INTERVAL_MS: "10000"
SHEET_SYNC_BATCH_SIZE: "25"
SHEET_SYNC_MAX_RETRIES: "5"
SHEET_SYNC_DELETION_GUARD_MAX: "10"
SHEET_SYNC_DELETION_GUARD_FRACTION: "0.05"
